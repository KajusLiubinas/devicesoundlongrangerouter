<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Broadcast System</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div class="container">
        <h1>Audio Router Portal</h1>
        <p class="status-box">Status: <span id="status" class="disconnected">Disconnected</span></p>

        <div class="card-grid">
            <div class="card">
                <h2>Broadcast Audio</h2>
                <p>Use this device to capture and transmit audio to the network.</p>
                <button id="start-mic-btn" class="btn btn-primary">Start Microphone</button>
                <button id="stop-mic-btn" class="btn btn-danger" disabled>Stop Microphone</button>
            </div>

            <div class="card">
                <h2>Receive Audio</h2>
                <p>Click below to activate this device as an audio node receiver.</p>
                <button id="listen-btn" class="btn btn-success">Activate Speaker</button>
                <div id="playing-indicator" class="indicator hidden">🔊 Playing Stream...</div>
            </div>
        </div>
    </div>

    <script>
        // Automatically connect to the hosting Render server
        const socket = io();
        
        const statusEl = document.getElementById('status');
        const startMicBtn = document.getElementById('start-mic-btn');
        const stopMicBtn = document.getElementById('stop-mic-btn');
        const listenBtn = document.getElementById('listen-btn');
        const playingIndicator = document.getElementById('playing-indicator');

        let audioContext;
        let mediaStream;
        let processor;
        let source;

        // Connection Status Tracking
        socket.on('connect', () => {
            statusEl.textContent = 'Connected to Node';
            statusEl.className = 'connected';
        });

        socket.on('disconnect', () => {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'disconnected';
            stopMicrophone();
        });

        // --- TRANSMITTER CODE (Your Phone) ---
        startMicBtn.addEventListener('click', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                source = audioContext.createMediaStreamSource(mediaStream);
                
                // Process audio chunks
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                source.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    const inputData = e.inputBuffer.getChannelData(0);
                    // Convert Float32Array down to Int16Array to save bandwidth
                    const outputData = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        outputData[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                    }
                    socket.emit('audio-stream', outputData.buffer);
                };

                startMicBtn.disabled = true;
                stopMicBtn.disabled = false;
                statusEl.textContent = 'Broadcasting Live...';
                statusEl.className = 'streaming';

            } catch (err) {
                console.error('Microphone access denied:', err);
                alert('Could not open microphone. Ensure you allowed permissions over HTTPS.');
            }
        });

        function stopMicrophone() {
            if (processor) processor.disconnect();
            if (source) source.disconnect();
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if (audioContext) audioContext.close();
            
            startMicBtn.disabled = false;
            stopMicBtn.disabled = true;
            if(socket.connected) {
                statusEl.textContent = 'Connected to Node';
                statusEl.className = 'connected';
            }
        }

        stopMicBtn.addEventListener('click', stopMicrophone);

        // --- RECEIVER CODE (The Demo Phone) ---
        let receiveContext;
        let isListening = false;

        listenBtn.addEventListener('click', () => {
            // Mobile devices require explicit interaction to unlock audio
            receiveContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            isListening = true;
            listenBtn.disabled = true;
            listenBtn.textContent = 'Speaker Active';
            playingIndicator.classList.remove('hidden');
        });

        socket.on('audio-stream', (buffer) => {
            if (!isListening || !receiveContext) return;

            // Reconstruct array buffer back to Float32 data
            const int16Buffer = new Int16Array(buffer);
            const float32Buffer = new Float32Array(int16Buffer.length);
            for (let i = 0; i < int16Buffer.length; i++) {
                float32Buffer[i] = int16Buffer[i] / 0x7FFF;
            }

            // Play the raw audio chunk
            const audioBuffer = receiveContext.createBuffer(1, float32Buffer.length, 16000);
            audioBuffer.getChannelData(0).set(float32Buffer);

            const bufferSource = receiveContext.createBufferSource();
            bufferSource.buffer = audioBuffer;
            bufferSource.connect(receiveContext.destination);
            bufferSource.start();
        });
    </script>
</body>
</html>
