<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUNDBEAM · SAFE SEPARATION</title>
    <style>
        /* ---------- RESET & SAFE LAYERS ---------- */
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background:#1a1a1a; color:#e0e0e0; height:100vh; overflow:hidden; }

        /* ----- TOP BAR (fully cyan background) ----- */
        .top-bar {
            position:fixed; top:0; left:0; right:0; height:60px;
            background:#2dd4bf;  /* fully cyan */
            padding:0 20px;
            display:flex; justify-content:space-between; align-items:center;
            border-bottom:2px solid #1a1a1a;
            z-index:1000;
            pointer-events:none; /* allow clicks through to screens */
        }
        .top-bar .username,
        .top-bar .admin-badge {
            pointer-events:auto;
            color:#1a1a1a; font-weight:700; text-shadow:none;
        }
        .username { font-size:1.1rem; }
        .admin-badge { background:#1a1a1a; color:#2dd4bf; padding:4px 12px; border-radius:20px; }

        /* ----- SCREENS (mutually exclusive full layers) ----- */
        .screen {
            position:fixed; top:60px; left:0; right:0; bottom:0;
            background:#1a1a1a;
            overflow-y:auto;
            display:none;   /* only active screen shows */
            z-index:100;
            padding:20px;
            flex-direction:column;
        }
        .screen.active { display:flex !important; }

        /* ---------- HOME SCREEN (device list + admin slider at bottom) ---------- */
        .home-content { flex:1; display:flex; flex-direction:column; min-height:100%; }
        .device-list-title { color:#2dd4bf; font-size:0.9rem; text-transform:uppercase; margin:0 0 15px 0; flex-shrink:0; }

        #devices-list-container {
            background:#2a2a2a; border-radius:16px; padding:12px; border:1px solid #404040;
            flex:1; overflow-y:auto; margin-bottom:20px;
        }
        .device-item {
            background:#333; margin:8px 0; padding:16px; border-radius:12px;
            border:1px solid #404040; display:flex; align-items:center; gap:12px;
            cursor:pointer; transition:0.1s;
        }
        .device-item.online { border-left:6px solid #2dd4bf; }
        .device-item.selected { border:2px solid #2dd4bf; background:#3a3a3a; }
        .device-icon { font-size:1.6rem; }
        .device-info { flex:1; }
        .device-name { font-size:1.1rem; font-weight:600; color:#2dd4bf; margin-bottom:4px; }
        .device-meta { display:flex; gap:15px; font-size:0.8rem; color:#aaa; }
        .device-battery.charging { color:#2dd4bf; }
        .device-age { color:#888; }

        /* admin slider at bottom (fixed within home screen) */
        .admin-slider-section {
            flex-shrink:0; background:#2a2a2a; border-top:2px solid #2dd4bf;
            padding:20px 0 0 0; margin-top:auto; border-radius:30px 30px 0 0;
        }
        .admin-label { color:#2dd4bf; font-size:0.9rem; font-weight:600; margin-bottom:12px; }
        .admin-slider-track {
            background:#333; height:70px; border-radius:40px; border:3px solid #2dd4bf;
            display:flex; align-items:center; position:relative; overflow:hidden;
        }
        .admin-slider-thumb {
            width:64px; height:64px; background:#2dd4bf; border-radius:50%; margin-left:3px;
            display:flex; align-items:center; justify-content:center; color:#1a1a1a;
            font-size:2rem; cursor:grab; z-index:5; transition:margin-left 0.1s;
        }
        .admin-slider-thumb.admin-active { margin-left:calc(100% - 67px); background:#2dd4bf; }
        .admin-slider-text {
            position:absolute; width:100%; text-align:center; color:#aaa;
            font-size:1rem; pointer-events:none;
        }
        /* no status text – only badge changes */

        /* ---------- SOUND + EXECUTE SCREEN (combined) ---------- */
        #sound-screen .back-btn {
            background:none; border:none; color:#2dd4bf; font-size:1.8rem;
            cursor:pointer; margin-bottom:10px; align-self:flex-start;
        }
        .sound-selector-title { color:#2dd4bf; font-size:1rem; margin:10px 0 15px; }
        #sound-list-container { margin-bottom:20px; }
        .sound-item {
            background:#2a2a2a; border-radius:12px; padding:18px; border:1px solid #404040;
            margin-bottom:10px; cursor:pointer;
        }
        .sound-item.selected { border:2px solid #2dd4bf; background:#333; }
        .sound-name { font-size:1.2rem; color:#2dd4bf; }
        .sound-meta { font-size:0.9rem; color:#aaa; margin-top:5px; }

        /* properties card (appears after sound selected) */
        .properties-card {
            background:#2a2a2a; border-radius:16px; padding:20px; border-left:6px solid #2dd4bf;
            margin:10px 0 20px;
        }
        .prop-row {
            display:flex; justify-content:space-between; padding:10px 0;
            border-bottom:1px solid #404040; font-size:1rem;
        }
        .prop-label { color:#aaa; }
        .prop-value { color:#2dd4bf; font-weight:600; }

        /* execute slider (at bottom of sound screen) */
        .combined-execute-slider {
            width:100%; margin-top:auto; padding-top:20px; position:sticky; bottom:10px;
        }
        .execute-track {
            background:#333; height:80px; border-radius:50px; border:3px solid #2dd4bf;
            display:flex; align-items:center; position:relative; overflow:hidden;
        }
        .execute-thumb {
            width:74px; height:74px; background:#2dd4bf; border-radius:50%; margin-left:3px;
            display:flex; align-items:center; justify-content:center; color:#1a1a1a;
            font-size:2.2rem; cursor:grab; z-index:5;
        }
        .execute-text {
            position:absolute; width:100%; text-align:center; color:#aaa;
            font-size:1.1rem; pointer-events:none;
        }

        /* ---------- PLAYING SCREEN ---------- */
        #playing-screen {
            justify-content:center; align-items:center; padding:20px;
        }
        .playing-icon { font-size:5rem; color:#2dd4bf; animation:pulse 1.5s infinite; margin-bottom:30px; }
        @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.1);} }
        .playing-device-name { color:#2dd4bf; font-size:2rem; font-weight:700; text-align:center; }
        .playing-sound-name { color:#e0e0e0; font-size:1.4rem; margin:20px 0 40px; text-align:center; }
        .stop-btn-large {
            background:#2dd4bf; border:none; color:#1a1a1a; font-size:2rem; font-weight:700;
            padding:20px 50px; border-radius:60px; cursor:pointer; max-width:300px; width:100%;
        }

        /* ---------- FULLSCREEN IMAGE (SCALED, not stretched) ---------- */
        .fullscreen-image {
            position:fixed; top:0; left:0; width:100vw; height:100vh;
            background:#000; z-index:10000; display:none;
            justify-content:center; align-items:center;
        }
        .fullscreen-image img {
            max-width:100%; max-height:100%; object-fit:scale-down; /* scaled, not stretched */
        }

        /* no fake devices ever */
    </style>
</head>
<body>
    <!-- top bar (fully cyan) -->
    <div class="top-bar">
        <div class="username" id="usernameDisplay">generating...</div>
        <div class="admin-badge" id="adminBadge">user</div>
    </div>

    <!-- SCREEN 1: HOME (device list + admin slider at bottom) -->
    <div class="screen active" id="home-screen">
        <div class="home-content">
            <div class="device-list-title">⚡ active devices</div>
            <div id="devices-list-container">
                <div style="text-align:center; color:#666; padding:40px;">waiting for real devices...</div>
            </div>
            <!-- admin slider fixed at bottom within home screen -->
            <div class="admin-slider-section">
                <div class="admin-label">🔒 administrator access</div>
                <div class="admin-slider-track" id="adminSliderTrack">
                    <div class="admin-slider-thumb" id="adminSliderThumb">🔒</div>
                    <div class="admin-slider-text">slide to enable admin mode</div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: SOUND + EXECUTE (combined) -->
    <div class="screen" id="sound-screen">
        <button class="back-btn" id="backFromSoundBtn">← back</button>
        <div class="sound-selector-title">🎵 select sound</div>
        <div id="sound-list-container"></div>

        <!-- properties card (hidden until sound selected) -->
        <div class="properties-card" id="propertiesCard" style="display:none;">
            <div class="prop-row"><span class="prop-label">device</span><span class="prop-value" id="propDeviceName">-</span></div>
            <div class="prop-row"><span class="prop-label">filename</span><span class="prop-value" id="propFilename">-</span></div>
            <div class="prop-row"><span class="prop-label">duration</span><span class="prop-value" id="propDuration">-</span></div>
            <div class="prop-row"><span class="prop-label">size</span><span class="prop-value" id="propSize">-</span></div>
        </div>

        <!-- execute slider (hidden until sound selected) -->
        <div class="combined-execute-slider" id="combinedExecuteSlider" style="display:none;">
            <div class="execute-track" id="executeTrack">
                <div class="execute-thumb" id="executeThumb">→</div>
                <div class="execute-text">slide to play on device</div>
            </div>
        </div>
    </div>

    <!-- SCREEN 3: PLAYING -->
    <div class="screen" id="playing-screen">
        <div class="playing-icon">🔊</div>
        <div class="playing-device-name" id="playingDeviceName">-</div>
        <div class="playing-sound-name" id="playingSoundName">-</div>
        <button class="stop-btn-large" id="playingStopBtn">⏹ stop</button>
    </div>

    <!-- fullscreen image (5 taps on home screen only) -->
    <div class="fullscreen-image" id="fullscreenImage">
        <img src="whoisthis.png" alt="secret">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        (function() {
            // ---------- SAFE STATE (no fake devices) ----------
            const app = {
                myUsername: '',
                isAdmin: false,
                connections: new Map(),          // real connections only
                selectedDeviceId: null,
                selectedDeviceName: null,
                selectedSound: null,
                audioContext: null,
                audioElement: null,
                tapCounter: 0,
                timer: null,

                // real mp3 library (from github)
                mp3Files: [
                    { file:'ambient.mp3', name:'Ambient Forest', duration:'3:45', size:'3.2 MB' },
                    { file:'ocean.mp3', name:'Ocean Waves', duration:'4:12', size:'3.8 MB' },
                    { file:'synth.mp3', name:'Synth Pad', duration:'5:30', size:'5.1 MB' },
                    { file:'piano.mp3', name:'Soft Piano', duration:'3:20', size:'2.9 MB' }
                ],

                init: function() {
                    this.generateUsername();
                    this.initPeer();
                    this.renderDeviceList();
                    this.setupAdminSlider();
                    this.setupExecuteSlider();
                    this.setupTapDetection();
                    this.setupNavigation();
                    this.populateSoundList();

                    // absolutely no fake devices
                },

                generateUsername: function() {
                    const adj = ['safe','real','cyber','audio','wave','pulse','flux'];
                    const nouns = ['pod','node','link','cell','core','relay'];
                    const num = Math.floor(Math.random()*900+100);
                    this.myUsername = adj[Math.floor(Math.random()*adj.length)] + 
                                     nouns[Math.floor(Math.random()*nouns.length)] + num;
                    document.getElementById('usernameDisplay').textContent = this.myUsername;
                },

                // ---------- PEER (real only) ----------
                initPeer: function() {
                    try {
                        const peer = new Peer({
                            config: { iceServers: [{ urls:'stun:stun.l.google.com:19302' }] }
                        });
                        peer.on('open', (id) => { console.log('peer open', id); });
                        peer.on('connection', (conn) => { this.handleConnection(conn); });
                        peer.on('error', (err) => console.warn('peer error', err));
                        this.peer = peer;
                    } catch(e){ console.warn('peer init failed'); }
                },

                handleConnection: function(conn) {
                    // store only real connections
                    this.connections.set(conn.peer, conn);
                    conn.metadata = { online:true, lastSeen:new Date() };

                    conn.on('data', (data) => { this.handleData(conn.peer, data); });
                    conn.on('close', () => { 
                        this.connections.delete(conn.peer); 
                        if(document.getElementById('home-screen').classList.contains('active')) 
                            this.renderDeviceList(); 
                    });

                    // send our info
                    conn.send({
                        type: 'info',
                        username: this.myUsername,
                        isAdmin: this.isAdmin,
                        battery: this.getBatteryLevel(),
                        charging: this.getCharging()
                    });
                },

                handleData: function(peerId, data) {
                    if(data.type === 'ring' && !this.isAdmin) {
                        // only ring if not admin
                        this.showPlayingScreen(data.from || 'device', data.mp3.name);
                        this.playAudio(data.mp3);
                    } else if(data.type === 'stop') {
                        this.stopAudio();
                    } else if(data.type === 'info') {
                        const conn = this.connections.get(peerId);
                        if(conn) {
                            conn.metadata = {
                                username: data.username,
                                isAdmin: data.isAdmin || false,
                                battery: data.battery,
                                charging: data.charging,
                                lastSeen: new Date(),
                                online: true
                            };
                            if(document.getElementById('home-screen').classList.contains('active')) 
                                this.renderDeviceList();
                        }
                    }
                },

                // ---------- DEVICE LIST (only non‑admin real devices) ----------
                renderDeviceList: function() {
                    const container = document.getElementById('devices-list-container');
                    // filter out admin devices
                    const peers = Array.from(this.connections.entries()).filter(([_,conn]) => 
                        conn.metadata && !conn.metadata.isAdmin
                    );

                    if(peers.length === 0) {
                        container.innerHTML = '<div style="text-align:center; color:#666; padding:40px;">no devices available</div>';
                        return;
                    }

                    let html = '';
                    peers.forEach(([id, conn]) => {
                        const meta = conn.metadata || {};
                        const username = meta.username || id.substring(0,5);
                        const battery = meta.battery || '?';
                        const charging = meta.charging ? '⚡' : '🔋';
                        const age = 'now'; // simplified

                        html += `
                            <div class="device-item online ${this.selectedDeviceId === id ? 'selected' : ''}" 
                                 data-device-id="${id}" data-device-name="${username}">
                                <span class="device-icon">📱</span>
                                <div class="device-info">
                                    <div class="device-name">${username}</div>
                                    <div class="device-meta">
                                        <span class="device-battery ${meta.charging ? 'charging' : ''}">${charging} ${battery}%</span>
                                        <span class="device-age">${age}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = html;

                    // click handler
                    container.querySelectorAll('.device-item').forEach(el => {
                        el.addEventListener('click', () => {
                            container.querySelectorAll('.device-item').forEach(d => d.classList.remove('selected'));
                            el.classList.add('selected');
                            this.selectedDeviceId = el.dataset.deviceId;
                            this.selectedDeviceName = el.dataset.deviceName;
                        });
                    });
                },

                // ---------- ADMIN SLIDER ----------
                setupAdminSlider: function() {
                    const track = document.getElementById('adminSliderTrack');
                    const thumb = document.getElementById('adminSliderThumb');
                    let isDragging = false;

                    const setAdmin = (active) => {
                        this.isAdmin = active;
                        if(active) {
                            thumb.classList.add('admin-active');
                            thumb.textContent = '✓';
                            document.getElementById('adminBadge').textContent = 'admin';
                        } else {
                            thumb.classList.remove('admin-active');
                            thumb.textContent = '🔒';
                            document.getElementById('adminBadge').textContent = 'user';
                        }
                        // broadcast change
                        this.connections.forEach(c => c.send({ 
                            type:'info', 
                            username:this.myUsername, 
                            isAdmin:this.isAdmin,
                            battery: this.getBatteryLevel(),
                            charging: this.getCharging()
                        }));
                    };

                    thumb.addEventListener('touchstart', (e) => { e.preventDefault(); isDragging=true; });
                    thumb.addEventListener('touchmove', (e) => {
                        if(!isDragging) return;
                        const touch = e.touches[0];
                        const trackRect = track.getBoundingClientRect();
                        const thumbRect = thumb.getBoundingClientRect();
                        let newLeft = touch.clientX - trackRect.left - thumbRect.width/2;
                        if(newLeft < 3) newLeft = 3;
                        if(newLeft > trackRect.width - thumbRect.width - 3) {
                            setAdmin(true);
                            isDragging=false;
                            return;
                        }
                        thumb.style.marginLeft = newLeft + 'px';
                    });
                    thumb.addEventListener('touchend', () => {
                        if(!this.isAdmin) thumb.style.marginLeft = '3px';
                        isDragging=false;
                    });

                    thumb.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging=true; });
                    document.addEventListener('mousemove', (e) => {
                        if(!isDragging) return;
                        const trackRect = track.getBoundingClientRect();
                        const thumbRect = thumb.getBoundingClientRect();
                        let newLeft = e.clientX - trackRect.left - thumbRect.width/2;
                        if(newLeft < 3) newLeft = 3;
                        if(newLeft > trackRect.width - thumbRect.width - 3) {
                            setAdmin(true);
                            isDragging=false;
                            return;
                        }
                        thumb.style.marginLeft = newLeft + 'px';
                    });
                    document.addEventListener('mouseup', () => {
                        if(!this.isAdmin) thumb.style.marginLeft = '3px';
                        isDragging=false;
                    });
                },

                // ---------- SOUND LIST ----------
                populateSoundList: function() {
                    const container = document.getElementById('sound-list-container');
                    let html = '';
                    this.mp3Files.forEach((s, idx) => {
                        html += `<div class="sound-item" data-sound-index="${idx}" data-sound-name="${s.name}" data-sound-file="${s.file}" data-duration="${s.duration}" data-size="${s.size}">
                            <div class="sound-name">${s.name}</div>
                            <div class="sound-meta">${s.duration} · ${s.size}</div>
                        </div>`;
                    });
                    container.innerHTML = html;

                    container.querySelectorAll('.sound-item').forEach(el => {
                        el.addEventListener('click', () => {
                            container.querySelectorAll('.sound-item').forEach(d => d.classList.remove('selected'));
                            el.classList.add('selected');
                            const idx = el.dataset.soundIndex;
                            this.selectedSound = {
                                name: el.dataset.soundName,
                                file: el.dataset.soundFile,
                                duration: el.dataset.duration,
                                size: el.dataset.size,
                                url: 'https://raw.githubusercontent.com/KajusLiubinas/devicesoundlongrangerouter/main/mp3/' + el.dataset.soundFile
                            };
                            this.showPropertiesAndExecute();
                        });
                    });
                },

                showPropertiesAndExecute: function() {
                    if(!this.selectedDeviceId || !this.selectedSound) return;
                    document.getElementById('propDeviceName').textContent = this.selectedDeviceName || 'device';
                    document.getElementById('propFilename').textContent = this.selectedSound.name;
                    document.getElementById('propDuration').textContent = this.selectedSound.duration;
                    document.getElementById('propSize').textContent = this.selectedSound.size;
                    document.getElementById('propertiesCard').style.display = 'block';
                    document.getElementById('combinedExecuteSlider').style.display = 'block';
                },

                // ---------- EXECUTE SLIDER ----------
                setupExecuteSlider: function() {
                    const track = document.getElementById('executeTrack');
                    const thumb = document.getElementById('executeThumb');
                    let isDragging = false;

                    const reset = () => { thumb.style.marginLeft = '3px'; isDragging=false; };
                    const execute = () => {
                        if(!this.selectedDeviceId || !this.selectedSound) return;
                        const conn = this.connections.get(this.selectedDeviceId);
                        if(!conn) return;
                        conn.send({
                            type: 'ring',
                            mp3: this.selectedSound,
                            from: this.myUsername
                        });
                        this.showPlayingScreen(this.selectedDeviceName, this.selectedSound.name);
                        this.playAudio(this.selectedSound);
                        reset();
                    };

                    thumb.addEventListener('touchstart', (e) => { e.preventDefault(); isDragging=true; });
                    thumb.addEventListener('touchmove', (e) => {
                        if(!isDragging) return;
                        const touch = e.touches[0];
                        const trackRect = track.getBoundingClientRect();
                        const thumbRect = thumb.getBoundingClientRect();
                        let newLeft = touch.clientX - trackRect.left - thumbRect.width/2;
                        if(newLeft < 3) newLeft = 3;
                        if(newLeft > trackRect.width - thumbRect.width - 3) {
                            execute();
                            return;
                        }
                        thumb.style.marginLeft = newLeft + 'px';
                    });
                    thumb.addEventListener('touchend', reset);
                    thumb.addEventListener('touchcancel', reset);

                    thumb.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging=true; });
                    document.addEventListener('mousemove', (e) => {
                        if(!isDragging) return;
                        const trackRect = track.getBoundingClientRect();
                        const thumbRect = thumb.getBoundingClientRect();
                        let newLeft = e.clientX - trackRect.left - thumbRect.width/2;
                        if(newLeft < 3) newLeft = 3;
                        if(newLeft > trackRect.width - thumbRect.width - 3) {
                            execute();
                            return;
                        }
                        thumb.style.marginLeft = newLeft + 'px';
                    });
                    document.addEventListener('mouseup', reset);
                },

                // ---------- PLAYBACK (sound play) ----------
                playAudio: function(mp3) {
                    if(this.audioContext && this.audioElement) this.audioElement.pause();
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.audioElement = new Audio(mp3.url);
                    const source = this.audioContext.createMediaElementSource(this.audioElement);
                    source.connect(this.audioContext.destination);
                    this.audioElement.play().catch(e=>console.warn);
                    this.audioElement.onended = () => this.stopAudio();
                },

                stopAudio: function() {
                    if(this.audioElement) { this.audioElement.pause(); this.audioElement.currentTime=0; }
                    this.connections.forEach(c => c.send({ type:'stop' }));
                    // return to home screen
                    this.showHomeScreen();
                },

                showPlayingScreen: function(device, sound) {
                    document.getElementById('playingDeviceName').textContent = device;
                    document.getElementById('playingSoundName').textContent = sound;
                    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                    document.getElementById('playing-screen').classList.add('active');
                },

                showHomeScreen: function() {
                    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                    document.getElementById('home-screen').classList.add('active');
                    this.selectedDeviceId = null;
                    this.selectedSound = null;
                    document.getElementById('propertiesCard').style.display = 'none';
                    document.getElementById('combinedExecuteSlider').style.display = 'none';
                    this.renderDeviceList(); // refresh list
                },

                // ---------- NAVIGATION ----------
                setupNavigation: function() {
                    // from home: when device selected, go to sound screen
                    document.addEventListener('click', (e) => {
                        const devItem = e.target.closest('.device-item');
                        if(devItem && document.getElementById('home-screen').classList.contains('active')) {
                            if(this.selectedDeviceId) {
                                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                                document.getElementById('sound-screen').classList.add('active');
                                // reset sound selection
                                this.selectedSound = null;
                                document.getElementById('propertiesCard').style.display = 'none';
                                document.getElementById('combinedExecuteSlider').style.display = 'none';
                                document.querySelectorAll('.sound-item').forEach(d => d.classList.remove('selected'));
                            }
                        }
                    });

                    document.getElementById('backFromSoundBtn').addEventListener('click', () => {
                        this.showHomeScreen();
                    });

                    document.getElementById('playingStopBtn').addEventListener('click', () => {
                        this.stopAudio();
                        this.showHomeScreen();
                    });
                },

                // ---------- 5-TAP (only on home screen) ----------
                setupTapDetection: function() {
                    document.body.addEventListener('click', (e) => {
                        const homeActive = document.getElementById('home-screen').classList.contains('active');
                        if(!homeActive) return;

                        this.tapCounter++;
                        if(this.timer) clearTimeout(this.timer);
                        this.timer = setTimeout(() => { this.tapCounter = 0; }, 1000);
                        if(this.tapCounter >= 5) {
                            document.getElementById('fullscreenImage').style.display = 'flex';
                            this.tapCounter = 0;
                        }
                    });

                    // click on image hides it
                    document.getElementById('fullscreenImage').addEventListener('click', function() {
                        this.style.display = 'none';
                    });
                },

                // helpers
                getBatteryLevel: () => Math.floor(Math.random()*40+60),
                getCharging: () => Math.random()>0.5,
            };

            app.init();
        })();
    </script>
</body>
</html>
